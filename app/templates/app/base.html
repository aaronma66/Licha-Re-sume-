<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Licha Resume{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --blue: #3B82C4;
      --blue-dark: #1A5FA8;
      --yellow: #F5B800;
      --yellow-dark: #D49A00;
      --navy: #1A2744;
      --white: #FFFFFF;
      --gray-light: #F4F6F9;
      --gray-border: #E2E8F0;
    }

    /* ── SPLASH SCREEN ── */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #splash-logo {
      width: 140px;
      height: 140px;
    }

    /* ── LOGO SVG PARTS ── */
    #logo-left-eye   { transform-origin: 37% 49%; }
    #logo-right-eye  { transform-origin: 63% 44%; }
    #logo-smile      { transform-origin: 50% 66%; }
    #logo-group      { transform-origin: 50% 50%; }

    /* Rotation: one full turn counter-clockwise over 1.2s */
    @keyframes rotateCCW {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    /* Wink: left eye (crescent) squishes to nothing and back */
    @keyframes winkEye {
      0%,  30% { transform: scaleY(1); }
      45%       { transform: scaleY(0); }
      60%       { transform: scaleY(1); }
      100%      { transform: scaleY(1); }
    }
    /* Wink dot: right eye disappears at same time */
    @keyframes winkDot {
      0%,  30% { transform: scale(1); }
      45%       { transform: scale(0); }
      60%       { transform: scale(1); }
      100%      { transform: scale(1); }
    }
    /* Smile bounce */
    @keyframes smileWink {
      0%,  30% { transform: scaleY(1); }
      45%       { transform: scaleY(1.25); }
      60%       { transform: scaleY(1); }
      100%      { transform: scaleY(1); }
    }

    /* Classes applied by JS after a tiny delay so browsers register them */
    .anim-rotate  { animation: rotateCCW 1.3s cubic-bezier(0.5,0,0.5,1) forwards; }
    .anim-wink    { animation: winkEye  1.3s ease forwards; }
    .anim-winkdot { animation: winkDot  1.3s ease forwards; }
    .anim-smile   { animation: smileWink 1.3s ease forwards; }

    /* ── NAVBAR ── */
    .navbar {
      background: var(--navy) !important;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--white) !important;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .navbar-brand .brand-dot-blue { color: var(--blue); }
    .navbar-brand .brand-dot-yellow { color: var(--yellow); }
    .nav-link { color: rgba(255,255,255,.8) !important; }
    .nav-link:hover { color: var(--yellow) !important; }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, var(--blue-dark) 0%, var(--navy) 60%, #0f1a30 100%);
      color: var(--white);
      padding: 4rem 0 3rem;
    }
    .hero h1 { font-size: 2.4rem; font-weight: 800; }
    .hero p   { font-size: 1.1rem; opacity: .85; }

    /* ── UPLOAD CARD ── */
    .upload-card {
      border: 2px dashed var(--gray-border);
      border-radius: 16px;
      background: var(--white);
      transition: border-color .2s, box-shadow .2s;
      cursor: pointer;
    }
    .upload-card:hover, .upload-card.drag-over {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(59,130,196,.12);
    }
    .upload-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.6rem;
      margin: 0 auto 1rem;
    }

    /* ── BUTTONS ── */
    .btn-primary {
      background: var(--blue);
      border-color: var(--blue);
      font-weight: 600;
    }
    .btn-primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
    .btn-warning {
      background: var(--yellow);
      border-color: var(--yellow-dark);
      color: var(--navy);
      font-weight: 600;
    }
    .btn-warning:hover { background: var(--yellow-dark); }

    /* ── SUMMARY CARDS ── */
    .summary-card {
      border: 1px solid var(--gray-border);
      border-radius: 14px;
      background: var(--white);
      transition: transform .15s, box-shadow .15s;
    }
    .summary-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(26,39,68,.1);
    }
    .card-badge-blue {
      background: rgba(59,130,196,.1);
      color: var(--blue-dark);
      font-size: .75rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .card-badge-yellow {
      background: rgba(245,184,0,.15);
      color: #8B6200;
      font-size: .75rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* ── SIMILARITY METER ── */
    .sim-bar-wrap { height: 6px; background: var(--gray-border); border-radius: 4px; overflow: hidden; }
    .sim-bar-fill { height: 6px; border-radius: 4px; transition: width .6s ease; }

    /* ── FOOTER ── */
    footer {
      background: var(--navy);
      color: rgba(255,255,255,.5);
      font-size: .85rem;
      padding: 1.5rem 0;
      margin-top: 4rem;
    }
    footer a { color: var(--yellow); text-decoration: none; }

    /* ── MISC ── */
    body { background: var(--gray-light); font-family: 'Segoe UI', system-ui, sans-serif; }
    .page-title { font-weight: 700; color: var(--navy); }
    .text-blue { color: var(--blue); }
    .text-navy { color: var(--navy); }
  </style>
</head>
<body>

<!-- ══ SPLASH ══ -->
<div id="splash">
  <svg id="splash-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="roundRect">
        <rect x="10" y="10" width="100" height="100" rx="22" ry="22"/>
      </clipPath>
    </defs>
    <g id="logo-group">
      <!-- Background rect -->
      <rect x="10" y="10" width="100" height="100" rx="22" ry="22" fill="#3B82C4"/>
      <!-- Yellow triangle (lower-right half) -->
      <polygon points="10,110 110,10 110,110" fill="#F5B800" clip-path="url(#roundRect)"/>

      <!-- Left eye: crescent moon -->
      <g id="logo-left-eye">
        <path d="M39 44 a9 9 0 1 0 14 -7 a6 6 0 1 1 -14 7z" fill="#1A2744"/>
      </g>

      <!-- Right eye: dot -->
      <g id="logo-right-eye">
        <circle cx="74" cy="50" r="4.5" fill="#1A2744"/>
      </g>

      <!-- Smile -->
      <g id="logo-smile">
        <path d="M38 72 Q60 90 82 72" stroke="#1A2744" stroke-width="5"
              stroke-linecap="round" fill="none"/>
      </g>
    </g>
  </svg>
</div>

<!-- ══ NAVBAR ══ -->
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="{% url 'index' %}">
      <svg width="30" height="30" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="5" width="110" height="110" rx="24" fill="#3B82C4"/>
        <polygon points="5,115 115,5 115,115" fill="#F5B800" clip-path="url(#nb-clip)"/>
        <defs><clipPath id="nb-clip"><rect x="5" y="5" width="110" height="110" rx="24"/></clipPath></defs>
        <path d="M36 42 a10 10 0 1 0 15 -8 a7 7 0 1 1 -15 8z" fill="#1A2744"/>
        <circle cx="76" cy="48" r="5" fill="#1A2744"/>
        <path d="M35 70 Q60 88 85 70" stroke="#1A2744" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      </svg>
      Licha <span class="brand-dot-blue">Re</span><span class="brand-dot-yellow">sume</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'index' %}"><i class="bi bi-house me-1"></i>Inicio</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- ══ MESSAGES ══ -->
{% if messages %}
<div class="container mt-3">
  {% for msg in messages %}
  <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show" role="alert">
    {{ msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
</div>
{% endif %}

<!-- ══ MAIN CONTENT ══ -->
{% block content %}{% endblock %}

<!-- ══ FOOTER ══ -->
<footer>
  <div class="container text-center">
    Licha Resume &mdash; Resumidor de documentos &bull; Hecho con Django &amp; Bootstrap 5
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ── Splash animation ──
  const SPLASH_KEY = 'resumia_splash_shown';

  function runSplash() {
    const group   = document.getElementById('logo-group');
    const leftEye = document.getElementById('logo-left-eye');
    const rightEye= document.getElementById('logo-right-eye');
    const smile   = document.getElementById('logo-smile');

    // Small timeout so browser paints before animation starts
    setTimeout(() => {
      group.classList.add('anim-rotate');
      leftEye.classList.add('anim-wink');
      rightEye.classList.add('anim-winkdot');
      smile.classList.add('anim-smile');

      // Hide splash after animation (1.3s) + short pause
      setTimeout(() => {
        document.getElementById('splash').classList.add('hidden');
      }, 1700);
    }, 80);
  }

  // Only show splash once per session
  if (!sessionStorage.getItem(SPLASH_KEY)) {
    sessionStorage.setItem(SPLASH_KEY, '1');
    runSplash();
  } else {
    document.getElementById('splash').classList.add('hidden');
  }
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
